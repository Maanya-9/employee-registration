<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Registration</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: auto; padding: 15px; }
    .form input, .form select, button { padding: 10px; font-size: 15px; margin: 5px 0; }
    .form input[type=text], .form input[type=email], .form input[type=password], .form select { width: 100%; box-sizing: border-box; }
    #message { padding: 10px; margin: 10px 0; display: none; }
    .success { background: #d4edda; color: #155724; display: block !important; }
    .error { background: #f8d7da; color: #721c24; display: block !important; }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 6px; font-size: 13px; white-space: nowrap; }
  </style>
</head>
<body>
  <h2>Employee Registration</h2>
  <div id="message"></div>

  <div class="form">
    <input type="text" id="employeeName" placeholder="Employee Name">
    <input type="text" id="employeeId" placeholder="Employee ID (blank = auto)">
    <input type="email" id="email" placeholder="Email Address">
    <input type="text" id="mobile" placeholder="Mobile Number (10 digits)">
    <input type="password" id="password" placeholder="Password">
    <input type="password" id="confirmPassword" placeholder="Confirm Password">

    <p>Gender:
      <input type="radio" name="gender" value="Male"> Male
      <input type="radio" name="gender" value="Female"> Female
      <input type="radio" name="gender" value="Other"> Other
    </p>

    <p>Date of Birth: <input type="date" id="dob"></p>

    <select id="department">
      <option value="">Select Department</option>
      <option>IT</option><option>HR</option><option>Finance</option><option>Sales</option>
    </select>

    <select id="designation">
      <option value="">Select Designation</option>
      <option>Developer</option><option>Manager</option><option>Analyst</option><option>Executive</option>
    </select>

    <p>Date of Joining: <input type="date" id="doj"></p>

    <select id="employmentType">
      <option value="">Select Employment Type</option>
      <option>Full Time</option><option>Part Time</option><option>Intern</option><option>Contract</option>
    </select>

    <p>Profile Photo: <input type="file" id="profilePhoto" accept="image/*"></p>

    <p><input type="checkbox" id="terms"> I accept Terms &amp; Conditions</p>

    <button id="registerBtn" onclick="saveForm()">Register</button>
    <button onclick="clearForm()">Reset / Clear</button>
    <p><a href="#">Already have an account? Login</a></p>
  </div>

  <hr>
  <h3>Employees</h3>
  <input type="text" id="searchBox" placeholder="Search by ID / Name / Email">
  <button onclick="searchClick()">Search</button>
  <button onclick="showAll()">Show All</button>
  <button onclick="downloadJSON()">Download JSON</button>

  <div class="scroll">
    <table>
      <thead><tr>
        <th>ID</th><th>Name</th><th>Email</th><th>Mobile</th><th>Gender</th><th>DOB</th>
        <th>Department</th><th>Designation</th><th>Joined</th><th>Type</th><th>Photo</th><th>Action</th>
      </tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
